server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 10M;

    # Compression des réponses texte (HTML, CSS, JS, JSON, SVG)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Fichiers sensibles : jamais servis
    location ~ /\.(env|git|ht) {
        deny all;
    }
    location ~* \.(sql|md|log|bat|sh)$ {
        deny all;
    }

    # CSS/JS/images de l'application : versionnés par ?v=, donc cache long
    location ~* ^/assets/(css|js|images)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
